<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перевод выделенного текста</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/quick.css"></head><body>
<main class="quick"><header><img src="/logo.svg" alt=""><div><h1>Перевод выделенного текста</h1><span id="shortcut">Выделите текст в любом приложении и нажмите Ctrl + Shift + T</span></div></header>
<div class="quick-languages"><label>С языка<select id="quick-source"></select></label><span>→</span><label>На язык<select id="quick-target"></select></label><span id="saved-label"></span></div>
<label class="quick-model-label">Переводчик<select id="quick-model" aria-label="Модель перевода выделения"></select></label><section class="quick-panels"><label>Исходный текст<textarea id="selection-text" placeholder="Здесь появится выделенный текст. Также можно вставить текст вручную."></textarea></label><label>Перевод<textarea id="translation" readonly placeholder="Перевод появится здесь…"></textarea></label></section>
<p id="quick-status" role="status">Приложение должно работать; основное окно можно свернуть.</p>
<footer><button class="button" id="translate-area">Область экрана</button><button class="button" id="translate-clipboard">Перевести буфер</button><button class="button" id="stop-translation">Остановить</button><span></span><button class="button" id="copy-translation">Копировать</button><button class="button primary" id="translate-manual">Перевести</button></footer>
</main><script src="/quick.js"></script></body></html>
