[package]
name = "local-gemma-studio"
version = "0.16.0"
edition = "2021"
description = "Local Rust desktop and web chat for TranslateGemma and a tool agent"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:wry", "dep:tao", "dep:clipboard-rs", "dep:global-hotkey", "dep:enigo", "dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
async-stream = "0.3"
include_dir = "0.7"
mime_guess = "2"
webbrowser = "1"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
wry = { version = "0.47.2", optional = true }
tao = { version = "0.30", optional = true }
clipboard-rs = { version = "0.3.5", optional = true }
global-hotkey = { version = "0.9", optional = true }
enigo = { version = "0.6", optional = true }
whatlang = "0.18"
rusqlite = { version = "0.40.1", features = ["bundled", "blob"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
sha2 = "0.10"
encoding_rs = "0.8"
pulldown-cmark = { version = "0.13.6", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4.3", features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false, optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"], optional = true }

[profile.release]
opt-level = 2
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

